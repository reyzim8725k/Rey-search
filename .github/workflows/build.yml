name: Build Rey Search Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validate sources
        run: python -m compileall -q .

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "Rey Search"
          --icon "assets/rey-search.ico"
          --add-data "assets;assets"
          --distpath dist
          main.py

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/'Rey Search.exe' release/'Rey Search.exe'
          Copy-Item README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath 'Rey-Search-Windows.zip' -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rey-Search-Windows
          path: |
            dist/Rey Search.exe
            Rey-Search-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rey Search.exe
            Rey-Search-Windows.zip
          generate_release_notes: true
